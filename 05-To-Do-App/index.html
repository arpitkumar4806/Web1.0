<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>To-Do App</title>
        <link rel="stylesheet" href="./assets/style.css" />
    </head>
    <body>
        <header class="header">
            <nav class="navbar"><h1 class="logo">To-Do App</h1></nav>
        </header>
        <main class="main">
            <section class="todo-form">
                <form action="" class="form" id="form">
                    <label class="field-group"
                        >Enter To-Do :-
                        <input
                            type="text"
                            id="todo"
                            class="field-input"
                            placeholder="Type Your To-Do and 'Click on Add' or 'Press Enter'"
                        /> </label
                    ><button type="submit" class="button">Add</button>
                </form>
            </section>
            <section class="todos">
                <h1 class="heading">TODOS</h1>
                <hr />
                <ul class="todo-list" id="todo-list"></ul>
            </section>
        </main>
        <footer class="footer">
            <p class="footer-text">&copy; Copyright | To-Do App</p>
        </footer>
        <script src="./assets/script.js"></script>
    </body>
</html>
